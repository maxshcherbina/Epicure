[workspace]
name = "cellpose-env"
version = "0.0.0"
description = "Cellpose (cellpose-SAM) isolated environment for EpiCure"
authors = ["EpiCure contributors"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "==3.10"
pip = "*"

[pypi-dependencies]
# Pinned to versions present in the local uv wheel cache (cp310) so pixi/uv reuse
# them instead of re-downloading multi-GB torch wheels (see wayfinder map, ticket
# D2 / the mobile-hotspot constraint). cellpose 4.x == cellpose-SAM.
cellpose = "==4.2.1.1"
appose = ">=0.10.1, <=0.11"

# torch/torchvision are cellpose deps; pin to the cached macOS-arm64 cp310 wheels
# (torch 2.11 <-> torchvision 0.26). On osx-arm64 the default torch wheel carries
# MPS support (no CUDA needed).
[target.osx-arm64.pypi-dependencies]
torch = "==2.11.0"
torchvision = "==0.26.0"

[target.osx-64.pypi-dependencies]
torch = "*"
torchvision = "*"

# ---------------- CUDA feature (Windows/Linux) — STUBBED, UNTESTED ----------------
# Structured to mirror the EpySeg env's default/cuda split. Not exercised in this
# effort (Mac arm64 only for now); wire real CUDA torch index-url when a GPU box
# is available. See wayfinder map "Not yet specified".
[feature.cuda.target.linux-64.pypi-dependencies]
torch = "*"
torchvision = "*"

[feature.cuda.target.win-64.pypi-dependencies]
torch = "*"
torchvision = "*"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"

# ---------------- ENVIRONMENTS ---------------- #

[environments]
default = { solve-group = "default" }
cuda = { features = ["cuda"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
