[workspace]
name = "epicure-trackastra-arm64"
version = "0.0.0"
description = "Pinned TrackAstra worker for EpiCure on Apple Silicon"
authors = ["EpiCure contributors"]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "==3.11"
pip = "*"
setuptools = ">=65,<82"

[pypi-dependencies]
trackastra = "==0.5.3"
torch = "==2.11.0"
appose = ">=0.10.1, <=0.11"

[environments]
default = { solve-group = "default" }
